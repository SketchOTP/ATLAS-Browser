appId: com.sketchotp.atlas
productName: ATLAS
artifactName: ATLAS-${version}-${os}-${arch}.${ext}
asar: true

directories:
  output: release

files:
  - electron-main.mjs
  - preload.cjs
  - server.mjs
  - agent-providers.mjs
  - codex-agent.mjs
  - browser-control.mjs
  - download-manager.mjs
  - library-reader.mjs
  - local-tts.mjs
  - local-voice.mjs
  - privacy-shield.mjs
  - profile-website-sessions.mjs
  - project-browser-isolation.mjs
  - website-media-permissions.mjs
  - website-window-routing.mjs
  - public/**/*
  - package.json
  - node_modules/pdfjs-dist/**/*

extraResources:
  - from: voice
    to: voice
    filter:
      - kokoro_worker.py

protocols:
  - name: Web URL
    schemes:
      - http
      - https

linux:
  executableName: atlas
  category: Utility
  icon: public/assets/atlas-mark.png
  syncDesktopName: true
  target:
    - AppImage
    - deb

deb:
  priority: optional

win:
  icon: public/assets/atlas-browser.ico
  target:
    - nsis
    - portable

nsis:
  artifactName: ATLAS-${version}-windows-${arch}-installer.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ATLAS

portable:
  artifactName: ATLAS-${version}-windows-${arch}-portable.${ext}

publish:
  provider: github
  owner: SketchOTP
  repo: ATLAS-Browser
