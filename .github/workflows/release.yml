name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            command: dist:linux
            artifact: linux
            provenance: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            command: dist:win
            artifact: windows
            provenance: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes xvfb libgtk-3-0 libnss3 libxss1 libxtst6 libatspi2.0-0 libsecret-1-0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:check
      - run: pnpm run ${{ matrix.command }}
      - run: pnpm run verify:package
      - name: Smoke-test packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run smoke:linux
      - name: Smoke-test Linux AppImage
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run smoke:linux -- release/*.AppImage
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ matrix.provenance }}
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == v0.* ]]; then release_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ATLAS ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${release_flags[@]}"
